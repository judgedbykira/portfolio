<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVEs & PoCs - Yeray Medina Piñero</title>
    <link href="css/main.css" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="manifest" href="assets/site.webmanifest">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <a href="index.html" style="text-decoration: none; color: inherit;">
        <div class="main" style="margin-bottom: 0; border-radius: 0 0 12px 12px;">
            <div class="info">
                <p class="nombre">Yeray 'JBKira' Medina Piñero</p>
                <p class="puestos">Cybersecurity Specialist || Penetration Tester</p>
            </div>
            <div class="img-container">
                <img class="logo" src="assets/logo.jpg" alt="Foto Yeray">
            </div>
        </div>
    </a>

    <!-- CVEs Section -->
    <div class="projects" style="margin-top: 30px;">
        <p class="projects-title">CVEs & PoCs</p>
        <p class="projects-subtitle">Vulnerabilities discovered and published with Proof of Concept</p>

        <!-- Search Bar -->
        <div class="search-container">
            <input type="text" id="cve-search-input" class="search-input"
                   placeholder="Search by CVE, technology, severity, vulnerability or version...">
            <i class="fas fa-search search-icon"></i>
        </div>

        <!-- Filter Buttons -->
        <div class="filter-buttons">
            <button class="filter-btn active" data-cve-filter="all">All</button>
            <button class="filter-btn" data-cve-filter="critical">Critical</button>
            <button class="filter-btn" data-cve-filter="high">High</button>
            <button class="filter-btn" data-cve-filter="medium">Medium</button>
            <button class="filter-btn" data-cve-filter="low">Low</button>
        </div>

        <!-- All CVEs Container -->
        <div id="all-cves-container" class="machines-grid"></div>
    </div>

    <!-- Footer -->
    <div style="width: 100%; max-width: 900px; margin: 0 auto; text-align: center; padding: 30px 20px; box-sizing: border-box;">
        <p style="color: #ff4f81; font-size: clamp(0.75rem, 2vw, 0.9rem); font-family: 'Courier New', monospace;">
            © 2026 Yeray Medina Piñero. All rights reserved.
        </p>
    </div>

    <script src="main.js"></script>
    <script src="js/scrollToTop.js"></script>
</body>
</html>
